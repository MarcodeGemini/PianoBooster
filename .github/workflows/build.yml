name: Build Piano Booster

on: [push, pull_request]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: brew install qt@5 fluidsynth rtmidi cmake
        
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5)
          make -j4
          
      - name: Save Mac App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Mac
          path: build/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
          
      - name: Save Windows App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Windows
          path: build/Release/

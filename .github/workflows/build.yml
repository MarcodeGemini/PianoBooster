name: Build Piano Booster

on: [push, pull_request]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: brew install qt@6 fluidsynth rtmidi cmake ftgl
        
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) -DCMAKE_BUILD_TYPE=Release
          make -j4
          
      - name: Package Dependencies for macOS
        run: |
          # 1. Ask the system to find the exact location of the bundle
          APP_PATH=$(find . -name "pianobooster.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find pianobooster.app anywhere!"
            exit 1
          fi
          
          echo "Found the app bundle successfully at: $APP_PATH"
          
          # 2. Run macdeployqt on that exact path
          $(brew --prefix qt@6)/bin/macdeployqt "$APP_PATH" -verbose=1
          
          # 3. Save the path to an environment variable for the artifact uploader
          echo "BUNDLE_PATH=$APP_PATH" >> $GITHUB_ENV
          
      - name: Save Mac App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Mac
          path: ${{ env.BUNDLE_PATH }}
          
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Windows Dependencies via Vcpkg
        run: |
          vcpkg install qtbase fluidsynth rtmidi ftgl --triplet x64-windows
          
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
          
      - name: Save Windows App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Windows
          path: build/Release/

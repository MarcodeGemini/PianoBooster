name: Build Piano Booster

on: [push, pull_request]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: brew install qt@6 fluidsynth rtmidi cmake ftgl
        
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) -DCMAKE_BUILD_TYPE=Release
          make -j4
          
      - name: Package Dependencies for macOS
        run: |
          # 1. Find the bundle
          APP_PATH=$(find . -name "pianobooster.app" -type d | head -n 1)
          
          # 2. Package the Qt frameworks into it
          $(brew --prefix qt@6)/bin/macdeployqt "$APP_PATH" -verbose=1
          
          # 3. FIX THE CRASH: Re-sign all frameworks for Apple Silicon
          codesign --force --deep --sign - "$APP_PATH"
          
          # 4. FIX THE LOOK: Move to a staging folder so GitHub doesn't strip the .app wrapper
          mkdir -p dist
          mv "$APP_PATH" dist/
          
      - name: Save Mac App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Mac
          path: dist/


name: Build Piano Booster

on: [push, pull_request]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: brew install qt@6 fluidsynth rtmidi cmake ftgl
        
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6) -DCMAKE_BUILD_TYPE=Release
          make -j4
          
      - name: Package Dependencies for macOS
        run: |
          if [ -d "build/pianobooster.app" ]; then
            $(brew --prefix qt@6)/bin/macdeployqt build/pianobooster.app -verbose=1
            echo "APP_PATH=build/pianobooster.app" >> $GITHUB_ENV
          elif [ -d "build/src/pianobooster.app" ]; then
            $(brew --prefix qt@6)/bin/macdeployqt build/src/pianobooster.app -verbose=1
            echo "APP_PATH=build/src/pianobooster.app" >> $GITHUB_ENV
          else
            echo "Error: App bundle not found!"
            exit 1
          fi
          
      - name: Save Mac App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Mac
          path: ${{ env.APP_PATH }}
          
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Windows Dependencies via Vcpkg
        run: |
          vcpkg install qtbase fluidsynth rtmidi ftgl --triplet x64-windows
          
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
          
      - name: Save Windows App
        uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Windows
          path: build/Release/
